<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2242" />
      <stop offset="100%" stop-color="#12162A" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="50%" stop-color="#FFB238" />
      <stop offset="100%" stop-color="#FF6B4A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#252C52" stroke-width="8" />

  <!-- Signal wave bars (Zero Signal / Offline aesthetic) -->
  <g opacity="0.35">
    <rect x="110" y="340" width="40" height="60" rx="10" fill="#8D95BD" />
    <rect x="175" y="300" width="40" height="100" rx="10" fill="#8D95BD" />
    <rect x="240" y="250" width="40" height="150" rx="10" fill="#8D95BD" />
    <rect x="305" y="190" width="40" height="210" rx="10" fill="#8D95BD" />
    <rect x="370" y="120" width="40" height="280" rx="10" fill="#8D95BD" />
  </g>

  <!-- Glowing Lightning / Zero-Signal Symbol -->
  <path
    d="M 285 90 L 165 270 L 255 270 L 225 425 L 355 235 L 265 235 Z"
    fill="url(#boltGrad)"
    filter="url(#glow)"
  />

  <!-- Offline status indicator dot -->
  <circle cx="410" cy="100" r="18" fill="#4ADE80" stroke="#12162A" stroke-width="6" />
</svg>
